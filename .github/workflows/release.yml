name: release
# A tag v* builds the Python distributions, signs each file with Sigstore (keyless, the workflow's identity; one
# bundle <file>.sigstore.json per file), writes SHA256SUMS, attests build provenance, and publishes a GitHub release.
# workflow_dispatch runs everything except the publication (dry run) - use it, or a signed -rc tag, after any change
# to this file before a real tag (17.09.2026: action bumps broke a release silently because CI does not run this
# workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write        # the release
  id-token: write        # keyless signing
  attestations: write    # build provenance
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist
      - uses: sigstore/cosign-installer@v3
        with:
          # pinned: cosign 3 writes and verifies Sigstore bundles (<file>.sigstore.json: signature, certificate and
          # transparency-log proof in one file); cosign 2's separate .sig/.pem cannot be verified with cosign 3
          cosign-release: "v3.1.3"
      - name: sign every file, then the checksums
        run: |
          cd dist
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          sha256sum -- * > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          ls -la
      - uses: actions/attest-build-provenance@v2
        # GitHub keeps build-provenance attestations for public repositories on every plan; for a private repository on
        # the free plan it refuses them ("Feature not available ... make this repository public", dry run 27.10.2026)
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: publish (tags only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pre=""; case "$TAG" in *-rc*) pre="--prerelease" ;; esac      # a release candidate is a pre-release
          gh release create "$TAG" --draft $pre --title "Entropy Protocol $TAG" --notes "See CHANGELOG.md."
          # one file at a time with retries: a parallel upload raced on one release and left partial sets
          # (21/25, 13/25) in another project on 17.09.2026
          for f in dist/*; do
            for attempt in 1 2 3; do
              gh release upload "$TAG" "$f" --clobber && break
              [ "$attempt" = 3 ] && { echo "upload failed: $f"; exit 1; }
              sleep 5
            done
          done
          want=$(ls dist | wc -l)
          have=$(gh release view "$TAG" --json assets --jq '.assets | length')
          [ "$have" = "$want" ] || { echo "assets: $have of $want - the draft stays unpublished"; exit 1; }
          gh release edit "$TAG" --draft=false
          echo "published $TAG with $have assets"
