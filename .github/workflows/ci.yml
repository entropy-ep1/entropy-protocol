name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # the oldest version pyproject.toml admits, and the newest: 26.09.2026 an f-string valid only on 3.12 (quotes
        # nested in quotes) broke a script on a 3.10 machine, and CI ran 3.12 alone
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: every Python file in the repository parses on this version
        run: |
          python - <<'EOF'
          import ast, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path(".").rglob("*.py")):
              if ".git" in p.parts or "node_modules" in p.parts:
                  continue
              try:
                  ast.parse(p.read_text(encoding="utf-8"), str(p))
              except SyntaxError as e:
                  bad.append(f"{p}:{e.lineno}: {e.msg}")
          print("\n".join(bad) or "all files parse")
          sys.exit(1 if bad else 0)
          EOF
      - name: install (CPU torch, pinned stack of the evaluation program)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.53.2" "cryptography>=43.0.3" "cbor2>=5.6" "markdown-it-py>=3" "pytest>=8" huggingface_hub \
            "signxml>=4" "lxml>=4.9" "hypothesis>=6.100"
          pip install -e .
      - name: the two test models into the cache
        # the backend never downloads (local_files_only): a test whose model is not cached skips itself, so without
        # this step the Qwen half of the suite (a byte-level BPE tokenizer with a chat template) would pass silently
        run: |
          python - <<'EOF'
          from huggingface_hub import snapshot_download as s
          for m in ("distilgpt2", "Qwen/Qwen2.5-0.5B-Instruct"):
              s(m, allow_patterns=["*.json", "*.safetensors", "*.txt"])
          # tokenizers only, for the property test that canonical tokenizations always join (four tokenizer families);
          # a tokenizer that cannot be fetched leaves its test skipped, and the skip is listed below (-rs)
          for m in ("microsoft/Phi-3-mini-4k-instruct", "mistralai/Mistral-7B-Instruct-v0.2"):
              try:
                  s(m, allow_patterns=["tokenizer*", "special_tokens_map.json", "config.json"])
              except Exception as exc:  # noqa: BLE001
                  print(f"::warning::{m} tokenizer not fetched: {exc}")
          EOF
      - name: unit tests (no model)
        run: python -m pytest tests -q -m "not model" -rs
      - name: model tests (distilgpt2 and Qwen2.5-0.5B on the CPU)
        run: python -m pytest tests -q -m model -rs
  conformance:
    # Two implementations of one specification: the vectors are regenerated by the Python reference and must equal
    # the committed file byte for byte, then the JavaScript implementation is run against them. A test that calls
    # both implementations is the only thing that catches drift between them (a compiling second implementation
    # can still be wrong).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install the Python reference (no torch needed for the vectors)
        run: |
          python -m pip install --upgrade pip
          pip install "cryptography>=43.0.3" "cbor2>=5.6" "markdown-it-py>=3"
      - name: vectors regenerate to the committed bytes
        run: |
          cp spec/test-vectors/ep1-vectors.json /tmp/committed.json
          PYTHONPATH=src python spec/make_vectors.py
          cmp spec/test-vectors/ep1-vectors.json /tmp/committed.json
      - name: the JavaScript implementation passes every vector
        run: node impl-js/check-vectors.mjs
      - name: evidence carries no operator-local paths
        # logs copied from an operator's machine keep its home and temp directories; the history was cleaned of them
        # on 26.09.2026 and this keeps it so (paths on the cloud machines, /home/ubuntu/..., are generic)
        run: |
          if git grep -nIE '/Users/[A-Za-z]|/private/(tmp|var)/' -- . ':!.github/workflows/ci.yml'; then
            echo "operator-local paths above: replace them before committing"; exit 1
          fi
          echo "no operator-local paths"
