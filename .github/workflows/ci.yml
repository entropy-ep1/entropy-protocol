name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # the oldest version pyproject.toml admits, and the newest: 26.09.2026 an f-string valid only on 3.12 (quotes
        # nested in quotes) broke a script on a 3.10 machine, and CI ran 3.12 alone
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: every Python file in the repository parses on this version
        run: |
          python - <<'EOF'
          import ast, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path(".").rglob("*.py")):
              if ".git" in p.parts or "node_modules" in p.parts:
                  continue
              try:
                  ast.parse(p.read_text(encoding="utf-8"), str(p))
              except SyntaxError as e:
                  bad.append(f"{p}:{e.lineno}: {e.msg}")
          print("\n".join(bad) or "all files parse")
          sys.exit(1 if bad else 0)
          EOF
      - name: install (CPU torch, pinned stack of the evaluation program)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.53.2" "cryptography>=42" "cbor2>=5.6" "markdown-it-py>=3" "pytest>=8" huggingface_hub
          pip install -e .
      - name: unit tests (no model)
        run: python -m pytest tests -q -m "not model"
      - name: model tests (distilgpt2 on the CPU)
        run: |
          python -c "from huggingface_hub import snapshot_download as s; s('distilgpt2', allow_patterns=['*.json','*.safetensors','*.txt'])"
          python -m pytest tests -q -m model
  conformance:
    # Two implementations of one specification: the vectors are regenerated by the Python reference and must equal
    # the committed file byte for byte, then the JavaScript implementation is run against them. A test that calls
    # both implementations is the only thing that catches drift between them (a compiling second implementation
    # can still be wrong).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install the Python reference (no torch needed for the vectors)
        run: |
          python -m pip install --upgrade pip
          pip install "cryptography>=42" "cbor2>=5.6" "markdown-it-py>=3"
      - name: vectors regenerate to the committed bytes
        run: |
          cp spec/test-vectors/ep1-vectors.json /tmp/committed.json
          PYTHONPATH=src python spec/make_vectors.py
          cmp spec/test-vectors/ep1-vectors.json /tmp/committed.json
      - name: the JavaScript implementation passes every vector
        run: node impl-js/check-vectors.mjs
