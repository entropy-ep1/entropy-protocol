[build-system]
requires = ["setuptools>=77"]    # SPDX license expression and license-files
build-backend = "setuptools.build_meta"

[project]
name = "entropy-protocol"
version = "0.1.0"
description = "Reference implementation of the Entropy Protocol: seal language-model text when it is written; verify it later, deterministically, with a record that reveals no text."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Roman Oliinyk" }, { name = "Serhii Nikolaichuk" }]
dependencies = ["cryptography>=43.0.3", "cbor2>=5.6"]    # enough to check statements, receipts and evidence packages

[project.urls]
Homepage = "https://github.com/entropy-ep1/entropy-protocol"
Repository = "https://github.com/entropy-ep1/entropy-protocol"
Issues = "https://github.com/entropy-ep1/entropy-protocol/issues"
Changelog = "https://github.com/entropy-ep1/entropy-protocol/blob/main/CHANGELOG.md"

[project.optional-dependencies]
model = ["torch>=2.2", "transformers>=4.44"]       # sealing, verification and detection read a language model
dev = ["pytest>=8", "hypothesis>=6.100"]
markdown = ["markdown-it-py>=3"]    # the visible-text layer (plain.py) when sealing
attested = ["signxml>=4", "lxml>=4.9"]    # appraising NVIDIA's signed reference manifests (attested/rim.py)
guest = ["nvidia-ml-py>=12.550.52"]       # collecting GPU evidence inside a confidential VM (attested/azure_cgpu.py)

[project.scripts]
entropy = "entropy_protocol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: tests that load a language model from the local Hugging Face cache"]
