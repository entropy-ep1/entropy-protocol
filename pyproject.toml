[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-protocol"
version = "0.1.0.dev0"
description = "Reference implementation of the Entropy Protocol: seal AI-generated text at generation, verify anywhere without revealing it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Roman Oliinyk" }, { name = "Serhii Nikolaichuk" }]
dependencies = ["torch>=2.2", "transformers>=4.44", "cryptography>=42", "cbor2>=5.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
markdown = ["markdown-it-py>=3"]    # the visible-text layer (plain.py) when sealing

[project.scripts]
entropy = "entropy_protocol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: tests that load a language model from the local Hugging Face cache"]
